services:
  - type: web
    name: ciclofit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CICLOFIT_ADMIN_EMAIL
        sync: false
      - key: CICLOFIT_ADMIN_PASSWORD
        sync: false
